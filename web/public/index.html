<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#02030d">
  <meta name="description" content="Space Math — a competitive space survival game where your mental maths, memory and logic decide how far you get. Explore a galaxy, beat Dreadnoughts, take the Daily Galaxy.">
  <meta property="og:title" content="Space Math — Think fast. Survive longer.">
  <meta property="og:description" content="Blast asteroids, crack Splitters, remember Beacon codes and beat the Daily Galaxy. How far can your brain take you?">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Space Math — Think Fast. Survive Longer.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>

<div id="stage">
  <div id="game">
    <canvas id="canvas"></canvas>

    <!-- ══ IN-RUN HUD ══ -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-label">SCORE</div>
        <div id="hudScore" class="hud-score">0</div>
        <div class="mult-row">
          <div id="hudMult" class="mult-badge">×1</div>
          <div class="mult-meter"><div id="hudMultFill"></div></div>
          <div id="hudStreak" class="streak">0</div>
        </div>
        <div id="hudPerks" class="perk-chips"></div>
      </div>
      <div class="hud-center">
        <div id="hudSector" class="sector-name">SECTOR 1</div>
        <div class="sector-bar"><div id="hudSectorFill"></div></div>
        <div id="hudSectorHint" class="sector-hint"></div>
      </div>
      <div class="hud-right">
        <div class="hull-row">
          <span class="hud-label">HULL</span>
          <div class="hull-bar"><div id="hudHullFill"></div></div>
          <span id="hudHull" class="hull-val">100</span>
        </div>
        <div class="hud-meta"><span id="hudTime">0:00</span><span id="hudGhost" class="ghost"></span></div>
        <div id="hudRival" class="rival hidden"></div>
      </div>
    </div>

    <div id="console" class="hidden">
      <div id="consoleLabel" class="c-label"></div>
      <div id="consolePrompt" class="c-prompt">—</div>
      <div class="c-eq">=</div>
      <div id="consoleInput" class="c-input"><span id="consoleValue"></span><span class="caret"></span></div>
      <div id="consoleNote" class="c-note">type to fire</div>
    </div>

    <div id="numpad" class="hidden">
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="-">−</button><button data-k="0">0</button><button data-k="del">⌫</button>
      <button data-k="enter" class="fire">FIRE</button>
    </div>

    <div id="banner" class="hidden"><div id="bannerTitle"></div><div id="bannerSub"></div></div>
    <div id="tip" class="hidden"></div>
    <div id="toast" class="hidden"></div>

    <!-- Perk draft -->
    <section id="draftScreen" class="screen draft hidden">
      <div class="kicker">SECTOR CLEARED · CHOOSE AN UPGRADE</div>
      <div id="draftCards" class="draft-cards"></div>
      <div class="keys">Press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> or click</div>
    </section>

    <button id="btnSound" class="icon-btn" title="Sound (M)">♫</button>
    <button id="btnPause" class="icon-btn hidden" title="Pause (Esc)">❚❚</button>

    <!-- ══ SCREENS (content rendered by js/ui/*) ══ -->
    <section id="welcomeScreen" class="screen hidden"></section>
    <section id="deckScreen" class="screen hub hidden"></section>
    <section id="galaxyScreen" class="screen hub hidden"></section>
    <section id="hangarScreen" class="screen hub hidden"></section>
    <section id="brainScreen" class="screen hub hidden"></section>
    <section id="codexScreen" class="screen hub hidden"></section>
    <section id="recordsScreen" class="screen hub hidden"></section>
    <section id="settingsScreen" class="screen hub hidden"></section>
    <section id="parentScreen" class="screen hub hidden"></section>
    <section id="pauseScreen" class="screen hidden"></section>
    <section id="debriefScreen" class="screen hub hidden"></section>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
